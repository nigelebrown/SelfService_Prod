name: security-build
on:
  push:
    branches: [ main, 'security/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check repository for likely plaintext secrets
        run: python3 scripts/check-secrets.py
      - name: Security architecture regression checks
        run: python3 scripts/security-static-check.py
      - name: Restore
        run: |
          dotnet restore src/JcfSspr.Portal/JcfSspr.Portal.csproj
          dotnet restore src/JcfSspr.Broker/JcfSspr.Broker.csproj
          dotnet restore tests/JcfSspr.Tests/JcfSspr.Tests.csproj
      - name: Build
        run: |
          dotnet build src/JcfSspr.Portal/JcfSspr.Portal.csproj -c Release --no-restore
          dotnet build src/JcfSspr.Broker/JcfSspr.Broker.csproj -c Release --no-restore
          dotnet build tests/JcfSspr.Tests/JcfSspr.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/JcfSspr.Tests/JcfSspr.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: Report vulnerable dependencies
        run: |
          dotnet list src/JcfSspr.Portal/JcfSspr.Portal.csproj package --vulnerable --include-transitive
          dotnet list src/JcfSspr.Broker/JcfSspr.Broker.csproj package --vulnerable --include-transitive
